# Bootstrap only: install before requesting the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name zdajegzamin.sbs www.zdajegzamin.sbs;
    include /etc/nginx/snippets/zdaj-egzamin-cloudflare-realip.conf;
    access_log off;
    error_log /var/log/nginx/zdaj-egzamin.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zdaj-egzamin-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 300 always;
        return 503;
    }
}
