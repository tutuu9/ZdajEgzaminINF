# Install as /etc/nginx/sites-available/zdaj-egzamin.conf after issuing the
# certificate. Enable its symlink; nginx -t must pass before nginx reload.
server {
    listen 80;
    listen [::]:80;
    server_name zdajegzamin.sbs www.zdajegzamin.sbs;
    include /etc/nginx/snippets/zdaj-egzamin-cloudflare-realip.conf;
    access_log off;
    error_log /var/log/nginx/zdaj-egzamin.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zdaj-egzamin-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://zdajegzamin.sbs$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zdajegzamin.sbs;
    include /etc/nginx/snippets/zdaj-egzamin-cloudflare-realip.conf;
    ssl_certificate /etc/letsencrypt/live/zdajegzamin.sbs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zdajegzamin.sbs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/zdaj-egzamin.error.log warn;
    return 308 https://zdajegzamin.sbs$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zdajegzamin.sbs;
    include /etc/nginx/snippets/zdaj-egzamin-cloudflare-realip.conf;
    ssl_certificate /etc/letsencrypt/live/zdajegzamin.sbs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zdajegzamin.sbs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 14m;
    access_log off;
    error_log /var/log/nginx/zdaj-egzamin.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zdaj-egzamin-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/zdaj-egzamin-proxy.conf;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location / {
        include /etc/nginx/snippets/zdaj-egzamin-proxy.conf;
    }
}
