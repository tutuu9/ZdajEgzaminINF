# Standalone public site: never merge with compose.yaml or compose.public.yaml.
# Use a locally built, verified Git-SHA image. There is intentionally no build or worker.
name: zdaj-egzamin-public

x-site-environment: &site-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://zdaj:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/zdaj
  APP_ORIGIN: ${PUBLIC_WEB_ORIGIN:?Set the canonical HTTPS origin}
  WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:?Set the canonical HTTPS origin}
  FRONTEND_ORIGIN: ${PUBLIC_WEB_ORIGIN:?Set the canonical HTTPS origin}
  APP_SECRET: ${APP_SECRET:?Set a new production APP_SECRET}
  IP_HASH_SECRET: ${IP_HASH_SECRET:?Set a separate production IP_HASH_SECRET}
  TRUST_PROXY: ${PUBLIC_TRUST_PROXY:?Set the exact Docker bridge gateway address}
  RUNNER_PROFILE: public-sandbox
  PUBLIC_SANDBOX_VERIFIED: 'false'
  DEEPSEEK_API_KEY: ''

x-logging: &limited-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    environment:
      POSTGRES_DB: zdaj
      POSTGRES_USER: zdaj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: ['postgres', '-c', 'max_connections=40', '-c', 'shared_buffers=96MB']
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zdaj -d zdaj']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 128
    logging: *limited-logging

  initialize:
    image: ${SITE_IMAGE:?Set the image tagged with the verified Git SHA}
    pull_policy: never
    command: ['npm', 'run', 'site:initialize']
    environment: *site-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *limited-logging

  api:
    image: ${SITE_IMAGE:?Set the image tagged with the verified Git SHA}
    pull_policy: never
    command: ['npm', 'run', 'start', '--workspace', '@zdaj/api']
    environment:
      <<: *site-environment
      HOST: 0.0.0.0
      PORT: 3001
      DATA_DIR: /app/data
      SERVE_WEB: 'true'
    volumes:
      - app-data:/app/data
    ports:
      - '127.0.0.1:8081:3001'
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *limited-logging

volumes:
  postgres-data:
  app-data:
